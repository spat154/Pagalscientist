# News sources for Made in India Magazine (Australia).
#
# We sense the news ourselves from free, public RSS/Atom feeds and Google News
# RSS queries. No paid wire. The mix is built around the three pillars:
#   - India national news (context for the diaspora)
#   - Australia news (where our readers live)
#   - Diaspora / India-Australia intersection queries (the core beat)
#
# trust_tier: 1 = official/paper-of-record, 2 = mainstream, 3 = aggregator/query
# audience_weight: how strongly the source skews to Australian-Indian readers.

feeds:
  # --- Australia (where readers live) ---
  - name: ABC News Australia - Top
    url: https://www.abc.net.au/news/feed/51120/rss.xml
    language: en
    trust_tier: 1
    audience_weight: 0.6
    topics: [australia, national]

  - name: SBS News - Australia
    url: https://www.sbs.com.au/news/topic/australia/feed
    language: en
    trust_tier: 1
    audience_weight: 0.7
    topics: [australia, multicultural]

  - name: The Guardian - Australia
    url: https://www.theguardian.com/australia-news/rss
    language: en
    trust_tier: 1
    audience_weight: 0.6
    topics: [australia, national]

  # --- India (context for the diaspora) ---
  - name: The Hindu - National
    url: https://www.thehindu.com/news/national/feeder/default.rss
    language: en
    trust_tier: 1
    audience_weight: 0.6
    topics: [india, national]

  - name: The Indian Express - India
    url: https://indianexpress.com/section/india/feed/
    language: en
    trust_tier: 1
    audience_weight: 0.6
    topics: [india, national]

  # --- Diaspora / India-Australia intersection (the core beat) ---
  - name: GNews - Indian community Australia
    url: https://news.google.com/rss/search?q=%22Indian%20community%22%20Australia%20OR%20%22Indian-Australian%22&hl=en-AU&gl=AU&ceid=AU:en
    language: en
    trust_tier: 3
    audience_weight: 0.98
    topics: [diaspora, community]

  - name: GNews - India Australia relations / trade
    url: https://news.google.com/rss/search?q=India%20Australia%20(trade%20OR%20visa%20OR%20students%20OR%20migration)&hl=en-AU&gl=AU&ceid=AU:en
    language: en
    trust_tier: 3
    audience_weight: 0.95
    topics: [diaspora, trade, migration, students]

  - name: GNews - Australia student visa / skilled migration
    url: https://news.google.com/rss/search?q=Australia%20(%22student%20visa%22%20OR%20%22skilled%20migration%22%20OR%20PR)&hl=en-AU&gl=AU&ceid=AU:en
    language: en
    trust_tier: 3
    audience_weight: 0.9
    topics: [migration, students, visa]

  - name: GNews - Indian culture / festivals Australia
    url: https://news.google.com/rss/search?q=(Diwali%20OR%20Holi%20OR%20%22Indian%20festival%22%20OR%20Bollywood)%20Australia&hl=en-AU&gl=AU&ceid=AU:en
    language: en
    trust_tier: 3
    audience_weight: 0.85
    topics: [culture, festivals, pillar2]

  - name: GNews - Indian diaspora global
    url: https://news.google.com/rss/search?q=%22Indian%20diaspora%22&hl=en-AU&gl=AU&ceid=AU:en
    language: en
    trust_tier: 3
    audience_weight: 0.8
    topics: [diaspora, global]
